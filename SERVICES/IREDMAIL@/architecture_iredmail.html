<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Architecture iRedMail - EcoTech</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #e0e0ff; font-size: 1.3em; margin-bottom: 30px; letter-spacing: 1px; }
  svg { display: block; margin: auto; }
  .box { rx: 8; ry: 8; }
</style>
</head>
<body>
<h1>Architecture iRedMail — HERA1 (10.10.20.2) — EcoTech Solutions</h1>
<svg width="960" height="720" viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg">

  <!-- Définitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7faaff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#66cc88"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffaa44"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6666"/>
    </marker>
  </defs>

  <!-- ===== COLONNE GAUCHE : CLIENTS EXTERNES ===== -->

  <!-- Client externe SMTP -->
  <rect x="20" y="60" width="140" height="55" rx="8" fill="#2a3a5a" stroke="#7faaff" stroke-width="1.5"/>
  <text x="90" y="83" text-anchor="middle" fill="#aaccff" font-size="12" font-weight="bold">Client externe</text>
  <text x="90" y="100" text-anchor="middle" fill="#7faaff" font-size="11">(envoi email)</text>

  <!-- Client Roundcube -->
  <rect x="20" y="200" width="140" height="55" rx="8" fill="#2a3a5a" stroke="#7faaff" stroke-width="1.5"/>
  <text x="90" y="223" text-anchor="middle" fill="#aaccff" font-size="12" font-weight="bold">Navigateur</text>
  <text x="90" y="240" text-anchor="middle" fill="#7faaff" font-size="11">(Roundcube/HTTPS)</text>

  <!-- Client IMAP/POP3 -->
  <rect x="20" y="340" width="140" height="55" rx="8" fill="#2a3a5a" stroke="#7faaff" stroke-width="1.5"/>
  <text x="90" y="360" text-anchor="middle" fill="#aaccff" font-size="12" font-weight="bold">Client mail</text>
  <text x="90" y="377" text-anchor="middle" fill="#7faaff" font-size="11">(Thunderbird…)</text>
  <text x="90" y="393" text-anchor="middle" fill="#88aaff" font-size="10">IMAP:143/993</text>

  <!-- ===== BOÎTE SERVEUR HERA1 ===== -->
  <rect x="200" y="20" width="590" height="620" rx="16" fill="none" stroke="#334466" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="495" y="50" text-anchor="middle" fill="#556688" font-size="13" font-weight="bold">SERVEUR HERA1 — 10.10.20.2/26 — Debian 13</text>

  <!-- POSTFIX -->
  <rect x="240" y="70" width="150" height="70" rx="8" fill="#1e3a4a" stroke="#44aacc" stroke-width="2"/>
  <text x="315" y="95" text-anchor="middle" fill="#44ccee" font-size="13" font-weight="bold">POSTFIX</text>
  <text x="315" y="112" text-anchor="middle" fill="#88ccdd" font-size="10">MTA — SMTP</text>
  <text x="315" y="128" text-anchor="middle" fill="#88ccdd" font-size="10">ports 25 / 465 / 587</text>

  <!-- AMAVIS -->
  <rect x="430" y="70" width="150" height="70" rx="8" fill="#2a2a1e" stroke="#ccaa22" stroke-width="2"/>
  <text x="505" y="95" text-anchor="middle" fill="#eebb33" font-size="13" font-weight="bold">AMAVIS</text>
  <text x="505" y="112" text-anchor="middle" fill="#ccaa55" font-size="10">Antispam / Antivirus</text>
  <text x="505" y="128" text-anchor="middle" fill="#ccaa55" font-size="10">SpamAssassin + ClamAV</text>

  <!-- DKIM -->
  <rect x="620" y="70" width="130" height="70" rx="8" fill="#1e2a1e" stroke="#44cc44" stroke-width="2"/>
  <text x="685" y="95" text-anchor="middle" fill="#66ee66" font-size="13" font-weight="bold">DKIM</text>
  <text x="685" y="112" text-anchor="middle" fill="#88cc88" font-size="10">Signature emails</text>
  <text x="685" y="128" text-anchor="middle" fill="#88cc88" font-size="10">sortants RSA 2048</text>

  <!-- NGINX -->
  <rect x="240" y="210" width="150" height="70" rx="8" fill="#2a1e3a" stroke="#aa44cc" stroke-width="2"/>
  <text x="315" y="235" text-anchor="middle" fill="#cc66ee" font-size="13" font-weight="bold">NGINX</text>
  <text x="315" y="252" text-anchor="middle" fill="#aa66cc" font-size="10">Reverse Proxy</text>
  <text x="315" y="268" text-anchor="middle" fill="#aa66cc" font-size="10">HTTPS → Roundcube</text>

  <!-- ROUNDCUBE -->
  <rect x="430" y="210" width="150" height="70" rx="8" fill="#2a1e2a" stroke="#ee44aa" stroke-width="2"/>
  <text x="505" y="235" text-anchor="middle" fill="#ff66bb" font-size="13" font-weight="bold">ROUNDCUBE</text>
  <text x="505" y="252" text-anchor="middle" fill="#cc6699" font-size="10">Webmail PHP</text>
  <text x="505" y="268" text-anchor="middle" fill="#cc6699" font-size="10">Interface utilisateur</text>

  <!-- DOVECOT -->
  <rect x="240" y="360" width="150" height="70" rx="8" fill="#1e2a3a" stroke="#4488cc" stroke-width="2"/>
  <text x="315" y="385" text-anchor="middle" fill="#66aaee" font-size="13" font-weight="bold">DOVECOT</text>
  <text x="315" y="402" text-anchor="middle" fill="#6699cc" font-size="10">Serveur IMAP/POP3</text>
  <text x="315" y="418" text-anchor="middle" fill="#6699cc" font-size="10">+ Auth LDAP → AD</text>

  <!-- MARIADB -->
  <rect x="430" y="360" width="150" height="70" rx="8" fill="#1e2a1e" stroke="#44bb44" stroke-width="2"/>
  <text x="505" y="385" text-anchor="middle" fill="#66dd66" font-size="13" font-weight="bold">MariaDB</text>
  <text x="505" y="402" text-anchor="middle" fill="#66aa66" font-size="10">Base vmail</text>
  <text x="505" y="418" text-anchor="middle" fill="#66aa66" font-size="10">comptes / quotas</text>

  <!-- STOCKAGE VMAIL -->
  <rect x="350" y="490" width="200" height="60" rx="8" fill="#1a2a1a" stroke="#336633" stroke-width="1.5"/>
  <text x="450" y="515" text-anchor="middle" fill="#55aa55" font-size="12" font-weight="bold">Stockage /var/vmail</text>
  <text x="450" y="533" text-anchor="middle" fill="#447744" font-size="10">LVM dédié (lv_data2)</text>

  <!-- ===== COLONNE DROITE : AD ARESKI ===== -->
  <rect x="820" y="330" width="130" height="80" rx="8" fill="#2a1a1a" stroke="#cc4444" stroke-width="2"/>
  <text x="885" y="358" text-anchor="middle" fill="#ee6666" font-size="12" font-weight="bold">AD / LDAP</text>
  <text x="885" y="375" text-anchor="middle" fill="#cc5555" font-size="10">ARESKI</text>
  <text x="885" y="392" text-anchor="middle" fill="#cc5555" font-size="10">10.10.20.4 :389</text>

  <!-- ===== FLÈCHES ===== -->

  <!-- Client externe → Postfix (SMTP entrant) -->
  <line x1="160" y1="87" x2="238" y2="100" stroke="#7faaff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="85" text-anchor="middle" fill="#7faaff" font-size="10">SMTP:25</text>

  <!-- Postfix → Amavis (filtrage) -->
  <line x1="390" y1="105" x2="428" y2="105" stroke="#ffaa44" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="409" y="98" text-anchor="middle" fill="#ffaa44" font-size="10">filtre</text>

  <!-- Amavis → DKIM (signature sortant) -->
  <line x1="580" y1="105" x2="618" y2="105" stroke="#66cc88" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="599" y="98" text-anchor="middle" fill="#66cc88" font-size="10">sign</text>

  <!-- Postfix → Dovecot (delivery locale) -->
  <line x1="315" y1="140" x2="315" y2="358" stroke="#44aacc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="260" fill="#44aacc" font-size="10">livraison</text>

  <!-- Dovecot → MariaDB (lecture comptes) -->
  <line x1="390" y1="395" x2="428" y2="395" stroke="#66cc88" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="409" y="388" text-anchor="middle" fill="#66cc88" font-size="10">vmail</text>

  <!-- Dovecot → AD (auth LDAP) -->
  <line x1="390" y1="410" x2="818" y2="385" stroke="#ff6666" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="620" y="388" text-anchor="middle" fill="#ff6666" font-size="10">bind LDAP:389</text>

  <!-- Dovecot → stockage -->
  <line x1="315" y1="430" x2="400" y2="490" stroke="#336633" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- MariaDB → stockage -->
  <line x1="505" y1="430" x2="490" y2="490" stroke="#336633" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Navigateur → Nginx -->
  <line x1="160" y1="225" x2="238" y2="245" stroke="#7faaff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="192" y="220" text-anchor="middle" fill="#7faaff" font-size="10">HTTPS:443</text>

  <!-- Nginx → Roundcube -->
  <line x1="390" y1="245" x2="428" y2="245" stroke="#aa44cc" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Roundcube → Dovecot -->
  <line x1="505" y1="280" x2="380" y2="358" stroke="#ee44aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="330" fill="#ee44aa" font-size="10">IMAP interne</text>

  <!-- Roundcube → Postfix (envoi) -->
  <line x1="430" y1="225" x2="390" y2="130" stroke="#ee44aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="175" fill="#ee44aa" font-size="10">SMTP:587</text>

  <!-- Client IMAP → Dovecot -->
  <line x1="160" y1="365" x2="238" y2="385" stroke="#4488cc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="358" text-anchor="middle" fill="#4488cc" font-size="10">IMAP/POP3</text>

  <!-- ===== LÉGENDE ===== -->
  <rect x="20" y="600" width="920" height="100" rx="8" fill="#111122" stroke="#333355" stroke-width="1"/>
  <text x="40" y="620" fill="#aaaacc" font-size="11" font-weight="bold">Légende :</text>
  <line x1="40" y1="640" x2="80" y2="640" stroke="#7faaff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="644" fill="#aaaacc" font-size="10">Flux email / SMTP</text>
  <line x1="200" y1="640" x2="240" y2="640" stroke="#ff6666" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="248" y="644" fill="#aaaacc" font-size="10">Auth LDAP (Active Directory)</text>
  <line x1="420" y1="640" x2="460" y2="640" stroke="#66cc88" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="468" y="644" fill="#aaaacc" font-size="10">Lecture/écriture MariaDB</text>
  <line x1="620" y1="640" x2="660" y2="640" stroke="#ee44aa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="668" y="644" fill="#aaaacc" font-size="10">Flux Roundcube</text>

  <text x="40" y="680" fill="#777799" font-size="10">Email ENTRANT : Internet → Postfix(25) → Amavis → Dovecot → /var/vmail</text>
  <text x="40" y="696" fill="#777799" font-size="10">Email SORTANT : Roundcube → Postfix(587) → Amavis → DKIM → Internet</text>
  <text x="40" y="712" fill="#777799" font-size="10">AUTH utilisateur : Dovecot interroge AD ARESKI via LDAP bind (port 389) — mot de passe jamais stocké localement</text>

</svg>
</body>
</html>
